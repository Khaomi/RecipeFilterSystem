<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Filter System</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 text-xl font-bold">
      Order up!
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <input type="text" placeholder="Search recipes..."
      class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

    <div class="grid gap-4 mt-6 sm:grid-cols-2 lg:grid-cols-3">
      <div class="bg-white rounded-xl shadow p-4">
        <h2 class="font-semibold">Example recipe</h2>
        <p class="text-sm text-gray-500">Card styled with Tailwind</p>
      </div>
    </div>
  </main>
</body>
</html>
