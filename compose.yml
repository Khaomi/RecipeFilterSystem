services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_started
        restart: true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      - PORT=${BACKEND_PORT:-8000}
      - POSTGRESDB_URL=postgresql://${POSTGRES_USER:-project}:${POSTGRES_PASSWORD:-ZB6NdtfZlzEkAdG9ELzp8bSXpNUQuuym}@postgresql:5432/${POSTGRES_DB:-project}
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:-project}:${MONGO_INITDB_ROOT_PASSWORD:-8j7Y57zArmmhsTe6ufqWCAZdBsj2l8zE}@mongodb:27017/
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      mongodb:
        condition: service_healthy
        restart: true

  postgresql:
    image: postgres:18.6-alpine
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-project}
      - POSTGRES_USER=${POSTGRES_USER:-project}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ZB6NdtfZlzEkAdG9ELzp8bSXpNUQuuym}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/src/recipe_schema_ver_02.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  mongodb:
    image: mongo:9.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-project}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-8j7Y57zArmmhsTe6ufqWCAZdBsj2l8zE}
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
