services:
  frontend:
    restart: no
    develop:
      watch:
        - action: sync+restart
          path: ./frontend/src
          target: /app/frontend/src
        - action: rebuild
          path: ./frontend/pyproject.toml
        - action: rebuild
          path: ./frontend/Dockerfile

  backend:
    restart: no
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/backend/src
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/Dockerfile
